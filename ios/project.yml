name: VCIStudent
options:
  bundleIdPrefix: vn.edu.vci
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
targets:
  VCIStudent:
    type: application
    platform: iOS
    sources:
      - VCIStudent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.edu.vci.student.dev
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Config/Info.plist
      configs:
        Debug:
          INFOPLIST_FILE: Config/Info-Debug.plist
    scheme:
      testTargets: []
